Host nikass-cloud-vps
  HostName 194.113.34.112
  User nikass
  IdentityFile ~/.ssh/nikass-cloud-vps
  IdentitiesOnly yes
  StrictHostKeyChecking yes
  UserKnownHostsFile ~/.ssh/known_hosts
  ConnectTimeout 10
  ServerAliveInterval 15
  ServerAliveCountMax 4
  ProxyCommand /usr/bin/nc -b en0 -G 8 %h %p
